l_simp_chinese:
 auto_qol_district_expansion:0 "区划扩容"
 auto_qol_district_expansion_desc:0 "打开本星球的区划扩容菜单，选择需要增加的区划容量。"
 auto_qol_district_expansion.title:0 "[Root.GetName]：区划扩容"
 auto_qol_district_expansion.desc:0 "§H本星球累计扩容§!\n§G＋[Root.auto_qol_district_expansion_total]§! £district£\n\n§H同步提升§!\n总区划容量\n£minerals£ 采矿区划上限\n£energy£ 发电区划上限\n£food£ 农业区划上限\n\n§L各类区划共享总容量。\n仅原本允许的区划可建造。§!"
 auto_qol_district_expansion_bonus:0 "永久区划扩容"
 auto_qol_district_expansion_bonus_desc:0 "本工具提供的总区划容量与采矿、发电、农业上限加成。"
 auto_qol_district_expansion.close:0 "完成扩容 · 关闭"
 auto_qol_district_expansion_header:0 "星政中枢  /  行星工程"
 auto_qol_district_expansion_note:0 "区划扩容"
 auto_qol_district_expansion_footer:0 "选择右侧档位增加区划容量。各类区划仍共享总容量。"
 auto_qol_district_expansion.add_1:0 "§G＋1§!    精细调整"
 auto_qol_district_expansion.add_1_tt:0 "总区划容量 +1；采矿、发电、农业区划上限各 +1。仅原本允许的区划可建造；重复选择继续累加，无法撤销。"
