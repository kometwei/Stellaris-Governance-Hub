 auto_qol_council.pick_cand_5_tt:0 "点击立即派驻 §H[qol_cand_5.GetName]§! 上任该内阁席位。"
 auto_qol_council.refresh_cands:0 "§Y【换一批候选领袖】§!"
 auto_qol_council.refresh_cands_tt:0 "重新从本国空闲领袖池中随机抽取另外 5 名候选领袖。"
 auto_qol_council.keep_vacant:0 "§C【仅部署席位，暂不派驻领袖】§!"
 auto_qol_council.keep_vacant_tt:0 "将该内阁席位加入政务内阁，但暂时保持职位空缺。"
 auto_qol_council.unassign_leader:0 "§R【将该内阁席位领袖卸任解职】§!"
 auto_qol_council.unassign_leader_tt:0 "罢免并卸任当前坐镇该席位的在任领袖，使其重回空闲状态。"
