 auto_qol_menu.1.name:0 "星政中枢"
 auto_qol_menu.1.desc:0 "欢迎使用 §H星政中枢§!。\n\n§E【核心功能模块】§!\n· §H特使智能建交§!：自动与常规AI建交，杜绝虚拟Mod国崩溃\n· §H舰队容量计算器§!：自由拨号微调指挥上限与舰容天花板\n· §H政务内阁指派§!：突破6席限制，点名指派领袖上任\n· §H招募池智能治理§!：一键清退多余闲人，彻底解决候选池卡顿\n· §H灵能三件套§!：完成灵能传统后一键完成三项科技\n· §H传统树安全激活§!：纯净安全无冲突，一键激活官方/Mod传统\n\n§R重要稳定性提示：只要在助手任意界面执行过会改动帝国状态的操作，当天都不要打开原版内阁。请先关闭助手窗口，让游戏经过至少一天。§!\n\n§L请在下方选择需要操作的功能模块：§!"
 auto_qol_menu.envoy_on:0 "£trigger_yes£ §G【已开启】§! 遭遇常规AI时秒开通讯 (点击关闭)"
 auto_qol_menu.envoy_off:0 "£trigger_no£ §R【已关闭】§! 遭遇常规AI时秒开通讯 (点击开启)"
 auto_qol_menu.toggle_envoy_tt:0 "开启后，当舰队或视野§G真实遭遇未知常规AI帝国§!时，将自动跳过特使繁琐流程并立即建立通讯。绝不盲开未探索的未知星域，严格仅限常规AI帝国，绝不影响土著文明、失落帝国与野怪安抚/科技研究，彻底杜绝外交界面崩溃。"
 auto_qol_menu.leader_on:0 "£trigger_yes£ §G【已开启】§! 领袖池防卡顿优化 (上限10人) (点击关闭)"
 auto_qol_menu.leader_off:0 "£trigger_no£ §R【已关闭】§! 领袖池防卡顿优化 (上限10人) (点击开启)"
 auto_qol_menu.toggle_leader_opt_tt:0 "将本国全部待招募领袖的总人数硬性限制为 10 人；第三方 Mod 新增的候选人数也会被即时修剪，防止后期卡顿。"
 auto_qol_menu.fleet_menu:0 "进入【舰队容量与指挥上限控制台】"
 auto_qol_menu.fleet_menu_tt:0 "打开舰队与指挥容量调节面板，支持快捷面额增减或一键清空。"
 auto_qol_menu.council_menu:0 "进入【内阁席位与领袖指派助手】"
 auto_qol_menu.council_menu_tt:0 "仅展示当前国家已解锁的内阁职位，进行精确手动指派，无需在一大堆无关选项中搜寻。"
 auto_qol_menu.psionic_bundle_ready:0 "一键完成【灵能三件套】科技"
 auto_qol_menu.psionic_bundle_ready_tt:0 "完成灵能传统后，立即获得尚未掌握的§H预知接口、灵能跃迁引擎、灵能护盾§!，无需反复进入虚境刷取。"
 auto_qol_menu.psionic_bundle_complete:0 "£trigger_yes£ §G【灵能三件套已全部掌握】§!"
 auto_qol_menu.psionic_bundle_complete_tt:0 "预知接口、灵能跃迁引擎与灵能护盾均已研究完成。"
 auto_qol_menu.psionic_bundle_locked:0 "£trigger_no£ §R【灵能三件套】需要先完成灵能传统§!"
 auto_qol_menu.psionic_bundle_locked_tt:0 "完成灵能传统后，此处将变为一键直接完成三项灵能科技的按钮。"
 auto_qol_menu.tradition_menu:0 "进入【Mod 传统多选勾选解锁】"
 auto_qol_menu.tradition_menu_tt:0 "勾选你需要的传统包，一键批量在游戏内激活。"
 auto_qol_menu.close:0 "关闭面板"

 auto_qol_fleet_menu.1.name:0 "舰队容量与指挥上限控制台"
 auto_qol_fleet_menu.1.desc:0 "§E当前已生效额外舰队容量§!：§G+[Root.qol_custom_navy_cap]§!   |   §E当前已生效额外指挥上限§!：§G+[Root.qol_custom_cmd_limit]§!\n----------------------------------------------------------------------------------------------------\n请选择需要调节的项目，或直接选用快捷预设面额：\n\n§R提示：执行任何调整后，当天不要打开原版内阁；请先过至少一天。§!"
 auto_qol_fleet_menu.go_navy_cap:0 "【调节舰队容量】 进入舰队容量快速增减菜单"
 auto_qol_fleet_menu.go_navy_cap_tt:0 "进入舰队容量子界面，支持以 +500、+1000、+5000 等各级面额快速增减。"
 auto_qol_fleet_menu.go_cmd_limit:0 "【调节指挥上限】 进入舰队指挥上限调节菜单"
 auto_qol_fleet_menu.go_cmd_limit_tt:0 "进入指挥上限子界面，支持以 +20、+50、+100、+500 等各级面额快速增减。"
 auto_qol_fleet_menu.preset_super:0 "§G【超级舰队预设】 一键加成 (+10000 舰容, +500 指挥上限)§!"
 auto_qol_fleet_menu.preset_super_tt:0 "一键为当前帝国快速增加 10000 舰队容量与 500 舰队指挥上限。"
 auto_qol_fleet_menu.clear_all:0 "§R【一键清空所有舰队与指挥上限加成】§!"
 auto_qol_fleet_menu.clear_all_tt:0 "将自定义的额外舰队容量与指挥上限全部重置清零。"
 auto_qol_fleet_menu.back:0 "返回助手主控制台"

