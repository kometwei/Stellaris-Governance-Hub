 auto_qol_council_menu.1.name:0 "帝国政务内阁辅助助手"
 auto_qol_council_menu.1.desc:0 "本模块为你提供内阁专属席位点名指派与候选池治理服务：\n\n· §H核心席位点名指派中枢§!：突破原版内阁 6 席位限制，直接为星穹铁道、科研、经济、军事等特定席位挂载并点名指定任意领袖上任（自带槽位自动保护，防止席位膨胀）。\n· §H招募池精简与大扫除§!：针对多 Mod 环境下候选池闲汉堆积卡顿进行快速清理与负向压制。\n· §H领袖专注协议§!：提供全局内阁领袖经验与执政效率增益。\n\n§R重要：只要进入并操作过本模块，当天都不要打开原版内阁；请先关闭助手窗口，让游戏经过至少一天。§!"
 auto_qol_council_menu.unlock_all_slots:0 "£trigger_yes£ §G【一键解锁全部内阁席位槽位】§!"
 auto_qol_council_menu.unlock_all_slots_tt:0 "立即将当前帝国内阁的所有空余席位槽位全部解锁开放，允许你安排更多内阁要员。"
 auto_qol_council_menu.auto_assign:0 "§C【一键自动指派空闲领袖到空缺席位】§!"
 auto_qol_council_menu.auto_assign_tt:0 "自动搜索本国空闲的科学家、指挥官与行政官，自动派驻填补科技主管、国防部长、国务大臣等空缺的内阁核心席位。"
 auto_qol_council_menu.open_more_council_assign:0 "§H【打开《更多内阁》领袖指派系统】§!"
 auto_qol_council_menu.open_more_council_assign_tt:0 "联动调用《更多内阁》(MORE COUNCIL POSITION) 专属领袖强行指派事件，直接选定席位并挑选领袖上任。"
 auto_qol_council_menu.open_more_council_slots:0 "§H【打开《更多内阁》席位添加系统】§!"
 auto_qol_council_menu.open_more_council_slots_tt:0 "联动调用《更多内阁》(MORE COUNCIL POSITION) 专属席位添加事件，将各类国策与起源席位强行部署至内阁。"
 auto_qol_council_menu.pool_mgr:0 "§C【待选领袖招募池精简与大扫除】§!"
 auto_qol_council_menu.pool_mgr_tt:0 "针对多 Mod 环境下待选领袖池人数恶性膨胀（几十人堆积卡顿）的专用治理中心。\n可一键清空冗余闲汉，或开启强力精简协议，将候选人压制在精炼健康的 3~5 人。"
 auto_qol_council_pool.1.name:0 "待选领袖招募池精简与大扫除中枢"
 auto_qol_council_pool.1.desc:0 "§H【多 Mod 领袖池堆积治理中心】§!\n\n在安装大量 Mod 后，各类科技、国策和传统会疯狂叠加“待选池数量”，导致招募面板堆积几十个领袖，引起严重的界面掉帧与月度演算卡顿。\n\n你可以通过下方工具瞬间清除多余候选人，或启用负向压制协议抵消 Mod 的滥发加成：\n\n§R提示：执行清理或压制后，当天不要打开原版内阁；请先过至少一天。§!"
 auto_qol_council_pool.clean:0 "£trigger_yes£ §R【一键清退当前全部待选闲人并立即刷新】§!"
 auto_qol_council_pool.clean_tt:0 "瞬间解雇并清理当前招募池里的所有未雇佣闲散人员，并强制命令帝国重新刷新一配合法、精炼的优质候选人，立即恢复界面丝滑！"
 auto_qol_council_pool.clamp_5:0 "§Y【启用待选池温和精简 (池子规模 -5)】§!"
 auto_qol_council_pool.clamp_5_tt:0 "抵消部分 Mod 的轻度叠加加成，清理 5 个多余名额并刷新。"
 auto_qol_council_pool.clamp_10:0 "§Y【启用待选池强力精简 (池子规模 -10)】§!"
 auto_qol_council_pool.clamp_10_tt:0 "抵消绝大多数 Mod 的中度叠加加成，将候选人压缩 10 个名额并刷新。"
 auto_qol_council_pool.clamp_20:0 "§G【启用待选池极限精简 (池子规模 -20，压至底限 3~4人)】§! (推荐)"
 auto_qol_council_pool.clamp_20_tt:0 "超绝压制！无论其它 Mod 怎么狂暴加人，强行将每类领袖候选人数压制在原汁原味、清爽干净的 3~4 人最佳状态！"
 auto_qol_council_pool.reset:0 "【关闭精简协议 (恢复 Mod 默认值)】"
 auto_qol_council_pool.reset_tt:0 "清除所有负向压制修正，恢复由其它 Mod 自由叠加的候选人数量。"
 auto_qol_council_pool.back:0 "返回内阁席位助手"
 auto_qol_council_menu.buff_council:0 "§Y【启用内阁领袖专注协议】§!"
 auto_qol_council_menu.buff_council_tt:0 "为帝国所有内阁要员提供 +50% 经验获取加速与 -25% 领袖维护费优化。"
 auto_qol_council_menu.back:0 "返回助手主控制台"
 auto_qol.close_direct:0 "离开并关闭界面 (X / ESC)"
 auto_qol_council_buff:0 "内阁领袖专注协议"
 auto_qol_council_buff_desc:0 "来自助手控制台的内阁效能优化，提升经验并降低维护费。"

 auto_qol_council_pick_leader.1.name:0 "内阁席位 - 领袖手动挑选派驻"
 auto_qol_council_pick_leader.1.desc:0 "§G【该职位已部署至帝国政务内阁！】§!\n\n请从下方候选领袖中挑选一位任命上任：\n\n1. §H[qol_cand_1.GetName]§! ([qol_cand_1.GetClass])\n2. §H[qol_cand_2.GetName]§! ([qol_cand_2.GetClass])\n3. §H[qol_cand_3.GetName]§! ([qol_cand_3.GetClass])\n4. §H[qol_cand_4.GetName]§! ([qol_cand_4.GetClass])\n5. §H[qol_cand_5.GetName]§! ([qol_cand_5.GetClass])\n\n§R任命/部署后当天不要打开原版内阁；请先过至少一天。§!"
 auto_qol_council.pick_cand_1:0 "派驻该领袖：[qol_cand_1.GetName] ([qol_cand_1.GetClass])"
 auto_qol_council.pick_cand_1_tt:0 "点击立即派驻 §H[qol_cand_1.GetName]§! 上任该内阁席位。"
 auto_qol_council.pick_cand_2:0 "派驻该领袖：[qol_cand_2.GetName] ([qol_cand_2.GetClass])"
 auto_qol_council.pick_cand_2_tt:0 "点击立即派驻 §H[qol_cand_2.GetName]§! 上任该内阁席位。"
 auto_qol_council.pick_cand_3:0 "派驻该领袖：[qol_cand_3.GetName] ([qol_cand_3.GetClass])"
 auto_qol_council.pick_cand_3_tt:0 "点击立即派驻 §H[qol_cand_3.GetName]§! 上任该内阁席位。"
 auto_qol_council.pick_cand_4:0 "派驻该领袖：[qol_cand_4.GetName] ([qol_cand_4.GetClass])"
 auto_qol_council.pick_cand_4_tt:0 "点击立即派驻 §H[qol_cand_4.GetName]§! 上任该内阁席位。"
