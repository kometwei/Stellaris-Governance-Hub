 tradition_unlock_menu.1.name:0 "Mod 传统智能激活助手"
 tradition_unlock_menu.1.desc:0 "欢迎使用智能条件匹配版传统助手。本系统拥有事前安全审计功能：\n\n1. §H【智能条件审计激活】§!：自动根据你当前帝国的政体与身份（普通帝国、机械、蜂巢或巨企）动态匹配符合条件的传统，不合条件的绝不强加；\n2. §H【跳过领袖初始特质】§!：自动剔除导致领袖池特质堆叠卡顿的恶性节点；\n3. §H【彻底杜绝卡顿】§!：后台秒级激活，界面丝滑不冻结。\n\n§R重要稳定性提示：只要在本助手里执行过传统激活、内阁席位、领袖任命、槽位修复等会刷新帝国/内阁状态的操作，当天都不要打开原版内阁界面。请先关闭助手窗口，让游戏经过至少一天，再查看原版内阁。§!"
 tradition_unlock_menu.opt_smart:0 "£trigger_yes£ §G【智能条件匹配一键激活全部传统】§! (强烈推荐)"
 tradition_unlock_menu.opt_smart_tt:0 "自动审计当前帝国身份，仅点亮符合本国政体与前置条件的传统，智能跳过非本国专属（如蜂巢/机械专属），彻底杜绝违和感与报错！\n\n§R点击执行后，当天不要打开原版内阁；请先过至少一天。§!"
 tradition_unlock_menu.opt_universal:0 "【仅激活纯通用无门槛传统】"
 tradition_unlock_menu.opt_universal_tt:0 "仅激活没有任何政体、思潮或外部门槛的普适传统。\n\n§R点击执行后，当天不要打开原版内阁；请先过至少一天。§!"
 tradition_unlock_mod_tidy:0 "【仅激活更加整洁的传统】"
 tradition_unlock_mod_tidy_tt:0 "仅激活《更加整洁的传统》中的安全传统节点。\n\n§R点击执行后，当天不要打开原版内阁；请先关闭助手窗口，让游戏经过至少一天。§!"
 tradition_unlock_menu.back:0 "返回助手主控制台"
 auto_qol_safety.1.name:0 "【安全防护】助手传统安全防护与熔断报告"
 auto_qol_safety.1.desc:0 "§H【事前防御性扫描完成】§!\n\n系统在为您执行传统激活时，已全自动完成了底层安全合规性审计：\n\n§G£trigger_yes£ 兼容传统已全部安全激活生效§!\n§E£trigger_no£ 已主动为您拦截并跳过致死风险传统！§!\n\n§Y【安全拦截明细】§!：\n1. §R拦截《更加整洁的传统》极限传统 (tr_tt_ultralimit)§!：含有 -10000 劳工政治权重恶性缺陷，导致 F2 相对实力除以零崩溃。\n2. §R拦截《圆环的庇护》极端调整传统 (tr_adaptability_*)§!：含有 -1000% 建造时间等负值溢出词条，导致建造进度条除以零崩溃。\n3. §R拦截格式塔/蜂巢/机械专属冲突传统§!：已智能跳过非当前政体支持的分支，避免逻辑错乱。\n\n当前帝国环境处于§G极度安全健康状态§!，F2 外交界面可随时自由查阅。"
 auto_qol_safety.1.ok:0 "§G[安全已确认] 感谢助手保驾护航§!"


