 auto_qol_mega_preview:0 "本批匹配 §Y[Root.aqm_found]§! 座建设阶段（含正在施工者）。\n可开工 §G[Root.aqm_ready]§! 座（已考虑当前资源和并行额度）。\n极端费用折扣跳过：[Root.aqm_price_skipped] 座。\n\n预计合计消耗：\n£alloys£ [Root.aqm_total_alloys]　£unity£ [Root.aqm_total_unity]\n£food£ [Root.aqm_total_food]　£energy£ [Root.aqm_total_energy]\n£minerals£ [Root.aqm_total_minerals]　£minor_artifacts£ [Root.aqm_total_minor_artifacts]\n\n确认时重新检查；不足者跳过，遍历顺序由游戏决定。预览不扣资源、不下达命令。"
 auto_qol_mega_result:0 "本次成功启动 §G[Root.aqm_ready]§! 座，原生启动未成功 §Y[Root.aqm_failed]§! 座。\n命中总数：[Root.aqm_found]；其余因资源、额度或条件不足跳过。\n\n成功启动项目的计算费用：\n£alloys£ [Root.aqm_total_alloys]　£unity£ [Root.aqm_total_unity]\n£food£ [Root.aqm_total_food]　£energy£ [Root.aqm_total_energy]\n\n已进入正常施工，不自动连续升级。"
