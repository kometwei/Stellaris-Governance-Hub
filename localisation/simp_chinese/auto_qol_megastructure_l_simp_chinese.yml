 auto_qol_mega_intro:0 "选择本批巨构类型。\n\n遵循资源、科技、阶段条件与并行施工额度。费用按构建时的原版定义和当前帝国成本修正计算。\n\n正在施工、特殊阶段和条件不足者跳过。不会新建巨构、立即完工或自动续建。成本降至原价 10% 以下的项目暂不代办。"
