 auto_qol_military_note:0 "下方显示本工具的额外加成；点击立即应用，减至零为止。上排增加，下排减少。"
 auto_qol_military_footer:0 "星球开发含施工、清障、环境改造与殖民地发展；巨构加成保留科技及独立数量限制。\n不占通用施工名额的巨构不受名额加成影响；重置只移除本工具本项加成。"
 auto_qol_military_military_footer:0 "§Y已内置上限扩展：舰队容量 1000 万；单舰队指挥上限 100000。最终以实际加载的 Mod 为准。§!\n本页“额外”为工具加成，超过上限后实际数值可能不再增加；重置仅移除本项加成。"
 auto_qol_military_automated_ratio_tt:0 "岗位自动化额外比例\n下方显示本工具的额外加成；点击立即应用，减至零为止。上排增加，下排减少。\n自动化比例与效率独立调节；自动化仍消耗能源，并受岗位规则及滑条限制。\n重置只移除本工具本项加成；星球开发含施工、清障、环境改造与殖民地发展。\n为允许自动化的原版岗位增加自动化比例，按百分点累加；工具额外比例限定 0～100。保留建筑等其他来源；实际自动劳力受岗位规则、现有岗位数与自动化滑条限制。自动化仍有能源维护费，重置只移除本工具的比例加成，不影响效率。"
 auto_qol_military_automated_output_tt:0 "自动化岗位产出（效率）\n下方显示本工具的额外加成；点击立即应用，减至零为止。上排增加，下排减少。\n自动化比例与效率独立调节；自动化仍消耗能源，并受岗位规则及滑条限制。\n重置只移除本工具本项加成；星球开发含施工、清障、环境改造与殖民地发展。\n增加原版自动劳动力效率，提高已有自动化岗位的产出；不授予自动化岗位或自动化覆盖率。与已有自动化效率加成叠加，实际变化以岗位明细为准；重置只移除本工具的加成。"
 auto_qol_military_mega_title:0 "星政中枢 · 巨构与工程"
 auto_qol_military_to_mega:0 "巨构与工程 →"
 auto_qol_military_constructor_speed_tt:0 "工程船施工速度\n下方显示本工具的额外加成；点击立即应用，减至零为止。上排增加，下排减少。\n星球开发含施工、清障、环境改造与殖民地发展；巨构加成保留科技及独立数量限制。\n不占通用施工名额的巨构不受名额加成影响；重置只移除本工具本项加成。\n统一提高工程船新建哨站、开采站、研究站和观测站的施工速度。不提高工程船航速或工程船自身的生产速度；巨构使用本页独立的巨构建造速度。重置只移除本项加成。"
 auto_qol_military_planet_footer:0 "自动化比例与效率独立调节；自动化仍消耗能源，并受岗位规则及滑条限制。\n重置只移除本工具本项加成；星球开发含施工、清障、环境改造与殖民地发展。"
 auto_qol_military_mega_production_tt:0 "巨构资源产出\n下方显示本工具的额外加成；点击立即应用，减至零为止。上排增加，下排减少。\n星球开发含施工、清障、环境改造与殖民地发展；巨构加成保留科技及独立数量限制。\n不占通用施工名额的巨构不受名额加成影响；重置只移除本工具本项加成。\n增加巨构经济类别的资源产出，可与奇观拓展的通用产出修正叠加；不提高舰容等非资源效果，也不改变事件直接发放的资源。重置只移除本工具的产出加成。"
