 auto_qol_starbase_clear_prev:0 "← 上一页"
 auto_qol_starbase_clear_next:0 "下一页 →"
 auto_qol_starbase_clear_picker:0 "选择恒星基地。"
 auto_qol_starbase_clear_more:0 "下一批基地"
 auto_qol_starbase_clear_restart:0 "从头浏览基地"
 auto_qol_starbase_clear_empty:0 "暂无其他普通基地，重新扫描"
 auto_qol_starbase_clear_choose:0 "重新选择基地"
 auto_qol_starbase_clear_refresh:0 "刷新基地状态"
 auto_qol_starbase_clear_modules:0 "清空全部模块…"
 auto_qol_starbase_clear_buildings:0 "清空全部建筑…"
 auto_qol_starbase_clear_both:0 "清空模块和建筑…"
 auto_qol_starbase_clear_confirm:0 "确认立即清空所选范围"
 auto_qol_starbase_clear_cancel:0 "取消，返回基地详情"
 auto_qol_starbase_clear_force_on:0 "§R【已开启】强拆§!"
 auto_qol_starbase_clear_force_off:0 "【已关闭】强拆"
 auto_qol_starbase_clear_detail:0 "目标：§Y[aqsc_selected.GetName]§!\n现有模块：[Root.aqsc_modules]\n现有建筑：[Root.aqsc_buildings]"
 auto_qol_starbase_clear_confirm_modules:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除该基地全部 §R[Root.aqsc_modules]§! 个模块，保留建筑。\n\n即时执行，不退还资源。基地等级与槽位配置不变。"
 auto_qol_starbase_clear_confirm_buildings:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除该基地全部 §R[Root.aqsc_buildings]§! 个建筑，保留模块。\n\n即时执行，不退还资源。基地等级与槽位配置不变。"
 auto_qol_starbase_clear_confirm_both:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除全部 §R[Root.aqsc_modules]§! 个模块和 §R[Root.aqsc_buildings]§! 个建筑。\n\n即时执行，不退还资源。基地等级与槽位配置不变。"
 auto_qol_starbase_clear_success:0 "已清空所选范围。\n\n目标：[aqsc_selected.GetName]\n剩余模块：[Root.aqsc_modules]\n剩余建筑：[Root.aqsc_buildings]\n\n未调整基地等级、槽位配置或资源。"
 auto_qol_starbase_clear_failed:0 "本次未能确认清空成功。基地条件可能已变化，或原生移除效果未达到目标；请返回详情刷新检查。"
 auto_qol_starbase_clear_reason_1:0 "目标已失效，请重新选择基地。"
 auto_qol_starbase_clear_reason_2:0 "已跳过：目标不是支持的自有普通基地、处于占领或交战状态。"
 auto_qol_starbase_clear_reason_3:0 "已跳过：检测到模块／建筑施工或排队，或基地正在升级。"
 auto_qol_starbase_clear_reason_4:0 "已跳过：含受保护设施。\n\n强拆开关仅放宽防御平台容量设施和船坞／兽坞；全国限量、特殊移除条件、隐藏设施及额外模块／建筑槽位设施仍然保留。"
 auto_qol_starbase_clear_reason_5:0 "已跳过：检测到本次播放集中的未适配／被 Mod 改写设施，或数量超过检查上限。\n\n已识别模块：[Root.aqsc_modules]\n已识别建筑：[Root.aqsc_buildings]\n\n更改设施 Mod 后请重新生成本地版。"
 auto_qol_starbase_clear_rules_tt:0 "即时移除、不退款。强拆仅放宽防御容量设施及船坞／兽坞保护；换基地或重新进入时默认关闭。\n\n选择一座自有普通恒星基地。每批最多十座，本轮不重复。\n\n选择后显示模块、建筑数量及是否允许清空。受保护基地可查看，但不能执行清空。"
 auto_qol_starbase_clear_detail_force:0 "目标：§Y[aqsc_selected.GetName]§!\n现有模块：[Root.aqsc_modules]\n现有建筑：[Root.aqsc_buildings]\n\n§R强拆已开启§!：允许拆除防御容量设施及船坞／兽坞，可能导致容量超限或影响造舰。"
 auto_qol_starbase_clear_confirm_modules_force:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除该基地全部 §R[Root.aqsc_modules]§! 个模块，保留建筑。\n\n即时执行，不退还资源。基地等级与槽位配置不变。\n\n§R强拆已开启：可能降低平台／离子炮容量或影响现有造舰订单。§! 本功能不主动拆除舰船、平台或取消订单；引擎后续处理尚待实测。"
 auto_qol_starbase_clear_confirm_buildings_force:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除该基地全部 §R[Root.aqsc_buildings]§! 个建筑，保留模块。\n\n即时执行，不退还资源。基地等级与槽位配置不变。\n\n§R强拆已开启：可能降低平台／离子炮容量或影响现有造舰订单。§! 本功能不主动拆除舰船、平台或取消订单；引擎后续处理尚待实测。"
 auto_qol_starbase_clear_confirm_both_force:0 "目标：§Y[aqsc_selected.GetName]§!\n\n即将移除全部 §R[Root.aqsc_modules]§! 个模块和 §R[Root.aqsc_buildings]§! 个建筑。\n\n即时执行，不退还资源。基地等级与槽位配置不变。\n\n§R强拆已开启：可能降低平台／离子炮容量或影响现有造舰订单。§! 本功能不主动拆除舰船、平台或取消订单；引擎后续处理尚待实测。"
