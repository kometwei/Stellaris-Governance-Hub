 auto_qol_starbase_clear_title:0 "星政中枢 · 恒星基地清空"
 auto_qol_starbase_clear_note:0 "先选择基地，再选择清空范围；操作前会再次检查保护条件。"
 auto_qol_starbase_clear_footer:0 "即时移除、不退款。强拆仅放宽防御容量设施及船坞／兽坞保护；换基地或重新进入时默认关闭。"
